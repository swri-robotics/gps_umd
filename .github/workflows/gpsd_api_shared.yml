name: gpsd API version (shared)

# The actual build-and-test logic for one GPSd C API (MAJOR, MINOR) pair.
#
# This is a reusable workflow: it is never triggered directly, only called by
# the thin per-version workflows (gpsd_api_9v0.yml, gpsd_api_16v1.yml, ...). Its own name is
# deliberately not gpsd_api_<M>v<m>, so a glob over the per-version set does
# not pick it up.
# Each of those appears separately in the Actions list with its own name,
# badge, run history and re-run button, so a failure is attributable to an API
# version without opening a matrix job -- while the logic below exists once.
#
# Those callers are generated by tools/generate_raw_msgs.py from the same
# REFERENCE_REVS manifest that produces the messages, so adding an API version
# creates its workflow too, and `--check` fails if the tree is out of date.
#
# The fast, gpsd-build-free checks live in gpsd_generator.yml.

on:
  workflow_call:
    inputs:
      gpsd:
        description: Release version or commit SHA to build libgps from.
        required: true
        type: string
      api:
        description: The API pair this revision must report, e.g. "16.1".
        required: true
        type: string
      msg:
        description: The raw message this pair must select, e.g. GPSDRaw16v1.
        required: true
        type: string

jobs:
  build_and_test:
    name: gpsd ${{ inputs.gpsd }}
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_against_gpsd.sh assumes a <workspace>/src/<repo> layout.
          path: src/gps_umd

      - name: Install build tools and workspace dependencies
        run: |
          apt-get update
          # python3-dev/python3-numpy: rosidl_generator_py's CMake needs
          # Python3's Development/NumPy components to build gps_msgs' Python
          # bindings; unlike under kilted-ros-base, lyrical-ros-base doesn't
          # pull these in transitively.
          apt-get install -y --no-install-recommends scons pkg-config \
            python3-dev python3-numpy
          rosdep update
          # Skip the system gpsd/libgps: the script builds libgps from source
          # at the requested revision and pins gpsd_client to that exact
          # install. The key is the rosdep name used in package.xml ("libgps"),
          # not the Debian package it resolves to ("libgps-dev").
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "libgps gpsd"

      - name: Cache the built message packages
        uses: actions/cache@v4
        with:
          # gps_msgs has no libgps dependency, so one build serves every API
          # version -- and every one of these ten workflows. Keyed on the
          # message sources rather than the commit, so it survives any change
          # that does not touch them, which is most of them.
          #
          # On a cold cache all ten workflows still build it, since they run
          # concurrently and cannot share a first build; the payoff is on every
          # run after.
          path: .gpsd_versions/msgs
          key: >-
            msgs-${{ runner.os }}-lyrical-${{
              hashFiles('src/gps_umd/gps_msgs/msg/*.msg',
                        'src/gps_umd/gps_msgs/CMakeLists.txt',
                        'src/gps_umd/gps_msgs/package.xml') }}

      - name: Cache gpsd build
        uses: actions/cache@v4
        with:
          # Cache only the expensive, image-independent artifacts: the GPSd
          # clone and the libgps install scons builds from it.
          #
          # Deliberately NOT .gpsd_versions/colcon -- those are CMake build
          # trees, and their CMakeCache.txt pins absolute paths to the base
          # image's Python. Restoring them after the image bumps its Python
          # makes CMake reuse the stale _Python3_* cache entries and fail with
          # "Could NOT find Python3 (missing: Development NumPy ...)", even
          # though a fresh configure in the same container succeeds.
          path: |
            .gpsd_versions/gpsd
            .gpsd_versions/install
          key: gpsd-${{ runner.os }}-${{ inputs.gpsd }}-v3

      - name: Build gpsd_client against gpsd ${{ inputs.gpsd }} and run tests
        id: run
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          GPSD_MSGS_INSTALL=$PWD/.gpsd_versions/msgs/install \
            src/gps_umd/tools/test_against_gpsd.sh ${{ inputs.gpsd }}

      - name: Confirm the expected raw message was selected
        id: selection
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          # Guards against the selection ladder silently picking the wrong
          # message: a build that compiles but publishes GPSDRaw14v0 when it
          # should publish GPSDRaw16v1 would otherwise pass unnoticed.
          header=.gpsd_versions/install/${{ inputs.gpsd }}/include/gps.h
          if [ ! -f "${header}" ]; then
            echo "libgps was never built; nothing to check" >&2
            exit 1
          fi
          major=$(awk '$2 == "GPSD_API_MAJOR_VERSION" { print $3 }' "${header}")
          minor=$(awk '$2 == "GPSD_API_MINOR_VERSION" { print $3 }' "${header}")
          echo "gps.h reports API ${major}.${minor}, expected ${{ inputs.api }}"
          test "${major}.${minor}" = "${{ inputs.api }}"
          test "GPSDRaw${major}v${minor}" = "${{ inputs.msg }}"

      - name: Upload build and test logs
        # Only on failure: these are only interesting when something broke, and
        # a passing run's logs are noise.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-api-${{ inputs.api }}
          path: .gpsd_versions/logs/
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## GPSd API ${{ inputs.api }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| GPSd revision | \`${{ inputs.gpsd }}\` |"
            echo "| Raw message | \`${{ inputs.msg }}\` |"
            echo "| Build + tests | ${{ steps.run.outcome }} |"
            echo "| Message selection | ${{ steps.selection.outcome }} |"
            if [ "${{ steps.run.outcome }}" != "success" ] \
               || [ "${{ steps.selection.outcome }}" != "success" ]; then
              echo
              echo "Logs are attached as the \`logs-api-${{ inputs.api }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
