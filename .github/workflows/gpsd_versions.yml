name: gpsd versions

on: [push, pull_request]

jobs:
  # Build gpsd_client against several real gpsd releases and run its parser
  # unit tests linked against each, exercising both parser variants. Unlike
  # the per-distro industrial_ci workflows (which matrix over ROS distros
  # against the system libgps), this matrixes over the gpsd/libgps ABI the
  # client is built on.
  gpsd_versions:
    name: gpsd ${{ matrix.gpsd }}
    # Only run when a tracked branch itself is updated, not on every push or
    # pull request (this job builds several gpsd releases from source).
    # TEMPORARY: more_gpsd_fix is here so the Python3 diagnostics below can be
    # run from that branch; drop it once the FindPython3 failure is fixed.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/ros2-devel' ||
      github.ref == 'refs/heads/more_gpsd_fix')
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    strategy:
      fail-fast: false
      matrix:
        # One release per parser variant plus the latest tracked release:
        #   3.20   -> API  9, GpsdParserV9  (minimum supported, V9 boundary)
        #   3.21   -> API 10, GpsdParserV16 (first V16 release)
        #   3.27.5 -> API 16, GpsdParserV16 (latest tested)
        gpsd: ['3.20', '3.21', '3.27.5']
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_against_gpsd.sh assumes a <workspace>/src/<repo> layout.
          path: src/gps_umd
      - name: Install build tools and workspace dependencies
        run: |
          apt-get update
          # python3-dev/python3-numpy: rosidl_generator_py's CMake needs
          # Python3's Development/NumPy components to build gps_msgs' Python
          # bindings; unlike under kilted-ros-base, lyrical-ros-base doesn't
          # pull these in transitively.
          apt-get install -y --no-install-recommends scons pkg-config \
            python3-dev python3-numpy
          rosdep update
          # Skip the system gpsd/libgps: the script builds libgps from source
          # at ${{ matrix.gpsd }} and pins gpsd_client to that exact install.
          # The key is the rosdep name used in package.xml ("libgps"), not the
          # Debian package it resolves to ("libgps-dev").
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "libgps gpsd"
      # TEMPORARY: diagnose why CMake's FindPython3 reports Development and
      # NumPy missing for the 3.14.4 interpreter it locates. Remove once the
      # cause is known and fixed.
      - name: Diagnose Python3 discovery
        shell: bash
        run: |
          set +e
          echo "=== interpreters on PATH ==="
          which -a python3 python3.14
          python3 -VV
          echo "=== python3-related packages ==="
          dpkg -l | grep -E '^ii +python3(\.[0-9]+)?(-dev|-numpy)? ' || true
          echo "=== ABI headers present? ==="
          ls -d /usr/include/python3.* 2>&1
          ls /usr/include/python3.*/Python.h 2>&1
          echo "=== sysconfig paths (as seen by the found interpreter) ==="
          python3 -c "import sys,sysconfig; print(sys.executable); print(sysconfig.get_paths())"
          python3 -c "import sysconfig; print('INCLUDEPY =', sysconfig.get_config_var('INCLUDEPY'))"
          python3 -c "import sysconfig; print('LIBDIR    =', sysconfig.get_config_var('LIBDIR'))"
          echo "=== numpy ==="
          python3 -c "import numpy; print(numpy.__version__, numpy.get_include())"
          echo "=== what CMake itself resolves ==="
          cmake --version
          cd "$(mktemp -d)"
          # Deliberately not REQUIRED: we want configure to succeed so the
          # per-component FOUND flags below tell us which part actually failed.
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.10)
          project(pyprobe LANGUAGES C)
          find_package(Python3 COMPONENTS Interpreter Development NumPy)
          message(STATUS "Python3_FOUND             = ${Python3_FOUND}")
          message(STATUS "Interpreter_FOUND         = ${Python3_Interpreter_FOUND}")
          message(STATUS "Development_FOUND         = ${Python3_Development_FOUND}")
          message(STATUS "Development.Module_FOUND  = ${Python3_Development.Module_FOUND}")
          message(STATUS "Development.Embed_FOUND   = ${Python3_Development.Embed_FOUND}")
          message(STATUS "NumPy_FOUND               = ${Python3_NumPy_FOUND}")
          message(STATUS "Python3_EXECUTABLE        = ${Python3_EXECUTABLE}")
          message(STATUS "Python3_VERSION           = ${Python3_VERSION}")
          message(STATUS "Python3_INCLUDE_DIRS      = ${Python3_INCLUDE_DIRS}")
          message(STATUS "Python3_LIBRARIES         = ${Python3_LIBRARIES}")
          message(STATUS "Python3_NumPy_INCLUDE_DIRS = ${Python3_NumPy_INCLUDE_DIRS}")
          EOF
          cmake -S . -B build 2>&1 | tail -40
          # --debug-find-pkg needs CMake >= 3.23; on older cmake it aborts
          # before configuring, so keep it in a separate throwaway run.
          echo "=== verbose find trace (CMake >= 3.23 only) ==="
          cmake -S . -B build-debug --debug-find-pkg=Python3 2>&1 | tail -80
          exit 0
      - name: Cache gpsd builds
        uses: actions/cache@v4
        with:
          path: .gpsd_versions
          key: gpsd-${{ runner.os }}-${{ matrix.gpsd }}
      - name: Build gpsd_client against gpsd ${{ matrix.gpsd }} and run parser tests
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          src/gps_umd/tools/test_against_gpsd.sh ${{ matrix.gpsd }}
