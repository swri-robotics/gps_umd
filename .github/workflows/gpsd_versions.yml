name: gpsd versions

on: [push, pull_request]

jobs:
  # Build gpsd_client against several real gpsd releases and run its parser
  # unit tests linked against each, exercising both parser variants. Unlike
  # the per-distro industrial_ci workflows (which matrix over ROS distros
  # against the system libgps), this matrixes over the gpsd/libgps ABI the
  # client is built on.
  gpsd_versions:
    name: gpsd ${{ matrix.gpsd }}
    # Only run when a tracked branch itself is updated, not on every push or
    # pull request (this job builds several gpsd releases from source).
    # TEMPORARY: more_gpsd_fix is here so the cache fix below can be verified
    # from that branch; drop it once the change lands on ros2-devel.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/ros2-devel' ||
      github.ref == 'refs/heads/more_gpsd_fix')
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    strategy:
      fail-fast: false
      matrix:
        # One release per parser variant plus the latest tracked release:
        #   3.20   -> API  9, GpsdParserV9  (minimum supported, V9 boundary)
        #   3.21   -> API 10, GpsdParserV16 (first V16 release)
        #   3.27.5 -> API 16, GpsdParserV16 (latest tested)
        gpsd: ['3.20', '3.21', '3.27.5']
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_against_gpsd.sh assumes a <workspace>/src/<repo> layout.
          path: src/gps_umd
      - name: Install build tools and workspace dependencies
        run: |
          apt-get update
          # python3-dev/python3-numpy: rosidl_generator_py's CMake needs
          # Python3's Development/NumPy components to build gps_msgs' Python
          # bindings; unlike under kilted-ros-base, lyrical-ros-base doesn't
          # pull these in transitively.
          apt-get install -y --no-install-recommends scons pkg-config \
            python3-dev python3-numpy
          rosdep update
          # Skip the system gpsd/libgps: the script builds libgps from source
          # at ${{ matrix.gpsd }} and pins gpsd_client to that exact install.
          # The key is the rosdep name used in package.xml ("libgps"), not the
          # Debian package it resolves to ("libgps-dev").
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "libgps gpsd"
      - name: Cache gpsd builds
        uses: actions/cache@v4
        with:
          # Cache only the expensive, image-independent artifacts: the gpsd
          # clone and the libgps installs scons builds from it.
          #
          # Deliberately NOT .gpsd_versions/colcon -- those are CMake build
          # trees, and their CMakeCache.txt pins absolute paths to the base
          # image's Python. Restoring them after the image bumps its Python
          # makes CMake reuse the stale _Python3_* cache entries and fail with
          # "Could NOT find Python3 (missing: Development NumPy ...)", even
          # though a fresh configure in the same container succeeds.
          path: |
            .gpsd_versions/gpsd
            .gpsd_versions/install
          # -v2 retires the existing caches, which still hold those build trees.
          key: gpsd-${{ runner.os }}-${{ matrix.gpsd }}-v2
      - name: Build gpsd_client against gpsd ${{ matrix.gpsd }} and run parser tests
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          src/gps_umd/tools/test_against_gpsd.sh ${{ matrix.gpsd }}
