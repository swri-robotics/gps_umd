name: gpsd versions

on: [push, pull_request]

jobs:
  # Fast job: the generator's own tests plus a drift check, with no gpsd
  # builds. Everything here needs is a gpsd clone to read gps.h out of, so it
  # finishes in a minute or two and catches the most common breakage --
  # regenerating produces something different from what is checked in.
  generator:
    name: generator + generated messages
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/gps_umd
      - name: Clone gpsd (history only, no build)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
          git clone --quiet --filter=blob:none \
            https://gitlab.com/gpsd/gpsd.git .gpsd_versions/gpsd
      - name: Generated files match the generator
        run: |
          python3 src/gps_umd/tools/generate_raw_msgs.py \
            --gpsd-repo .gpsd_versions/gpsd \
            --output-root src/gps_umd --check
      - name: Generator unit and output tests
        run: |
          cd src/gps_umd
          GPSD_REPO=${GITHUB_WORKSPACE}/.gpsd_versions/gpsd \
            python3 -m unittest discover -s tools -p 'test_*.py' -v

  # Build gpsd_client against a real libgps for every API pair the generator
  # emits a message for, and run the full test suite linked against each.
  #
  # Unlike the per-distro industrial_ci workflows (which matrix over ROS
  # distros against the system libgps), this matrixes over the gpsd/libgps ABI
  # the client is built on -- which is what selects the GPSDRaw<M>v<m> message
  # and the generated fill code.
  gpsd_versions:
    name: gpsd ${{ matrix.gpsd }} (API ${{ matrix.api }})
    # Only run when the ros2-devel branch itself is updated, not on every push
    # or pull request: this builds ten gpsd releases from source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ros2-devel'
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    strategy:
      fail-fast: false
      matrix:
        # One entry per (MAJOR, MINOR) pair in the generator's manifest, using
        # the same reference revision it generates that message from.
        #
        # The three bare SHAs are API pairs that shipped in no gpsd release;
        # they are reachable only by building a git checkout, so they are
        # pinned to the last commit at which each pair was current.
        include:
          - {gpsd: '3.20',      api: '9.0',  msg: GPSDRaw9v0}
          - {gpsd: 'e5279ef52', api: '9.1',  msg: GPSDRaw9v1}
          - {gpsd: '3.21',      api: '10.0', msg: GPSDRaw10v0}
          - {gpsd: '42f816d59', api: '10.1', msg: GPSDRaw10v1}
          - {gpsd: '3.22',      api: '11.0', msg: GPSDRaw11v0}
          - {gpsd: '3.23.1',    api: '12.0', msg: GPSDRaw12v0}
          - {gpsd: '264e808c6', api: '13.0', msg: GPSDRaw13v0}
          - {gpsd: '3.26.1',    api: '14.0', msg: GPSDRaw14v0}
          - {gpsd: '3.27.3',    api: '16.0', msg: GPSDRaw16v0}
          - {gpsd: '3.27.5',    api: '16.1', msg: GPSDRaw16v1}
          # No API 15 entry: GPSD_API_MAJOR_VERSION jumped 14 -> 16 in a single
          # commit and was never 15, despite the "15" stanza in gps.h's
          # changelog. gpsd 3.27/3.27.1/3.27.2 are also absent -- they are API
          # 16.0, already covered by 3.27.3, and they shipped a broken
          # api_version_major.
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/test_against_gpsd.sh assumes a <workspace>/src/<repo> layout.
          path: src/gps_umd
      - name: Install build tools and workspace dependencies
        run: |
          apt-get update
          # python3-dev/python3-numpy: rosidl_generator_py's CMake needs
          # Python3's Development/NumPy components to build gps_msgs' Python
          # bindings; unlike under kilted-ros-base, lyrical-ros-base doesn't
          # pull these in transitively.
          apt-get install -y --no-install-recommends scons pkg-config \
            python3-dev python3-numpy
          rosdep update
          # Skip the system gpsd/libgps: the script builds libgps from source
          # at ${{ matrix.gpsd }} and pins gpsd_client to that exact install.
          # The key is the rosdep name used in package.xml ("libgps"), not the
          # Debian package it resolves to ("libgps-dev").
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "libgps gpsd"
      - name: Cache gpsd builds
        uses: actions/cache@v4
        with:
          # Cache only the expensive, image-independent artifacts: the gpsd
          # clone and the libgps installs scons builds from it.
          #
          # Deliberately NOT .gpsd_versions/colcon -- those are CMake build
          # trees, and their CMakeCache.txt pins absolute paths to the base
          # image's Python. Restoring them after the image bumps its Python
          # makes CMake reuse the stale _Python3_* cache entries and fail with
          # "Could NOT find Python3 (missing: Development NumPy ...)", even
          # though a fresh configure in the same container succeeds.
          path: |
            .gpsd_versions/gpsd
            .gpsd_versions/install
          # -v3: the matrix now keys on API pairs and includes commit SHAs, so
          # the old per-release cache entries no longer line up.
          key: gpsd-${{ runner.os }}-${{ matrix.gpsd }}-v3
      - name: Build gpsd_client against gpsd ${{ matrix.gpsd }} and run tests
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          src/gps_umd/tools/test_against_gpsd.sh ${{ matrix.gpsd }}
      - name: Confirm the expected raw message was selected
        shell: bash
        run: |
          # Guards against the selection ladder silently picking the wrong
          # message: a build that compiles but publishes GPSDRaw14v0 when it
          # should publish GPSDRaw16v1 would otherwise pass unnoticed.
          header=.gpsd_versions/install/${{ matrix.gpsd }}/include/gps.h
          major=$(awk '$2 == "GPSD_API_MAJOR_VERSION" { print $3 }' "$header")
          minor=$(awk '$2 == "GPSD_API_MINOR_VERSION" { print $3 }' "$header")
          echo "gps.h reports API ${major}.${minor}, expected ${{ matrix.api }}"
          test "${major}.${minor}" = "${{ matrix.api }}"
          test "GPSDRaw${major}v${minor}" = "${{ matrix.msg }}"
