name: Kilted

on: [push, pull_request]

jobs:
  industrial_ci:
    # Job-level rather than in the matrix, where it would become part of each
    # job's name and no longer match the required status checks.
    env:
      # ament_cppcheck skips every cppcheck 2.x release unless this is set.
      DOCKER_RUN_OPTS: '-e AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS=1'
    strategy:
      matrix:
        env:
          - {ROS_DISTRO: kilted, ROS_REPO: testing, PIP_BREAK_SYSTEM_PACKAGES: True}
          - {ROS_DISTRO: kilted, ROS_REPO: main, PIP_BREAK_SYSTEM_PACKAGES: True}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}
