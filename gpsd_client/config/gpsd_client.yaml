gpsd_client:
  ros__parameters:
    # Stamp fix (NavSatFix) with the receiver's time rather than ROS time.
    # extended_fix and gpsd_raw are always stamped with ROS time; GPSFix.time
    # carries the receiver's time.
    use_gps_time: true
    check_fix_by_variance: false
    override_augmentation_source: false
    frame_id: gps
    publish_rate: 10
    # Seconds between attempts to reconnect when GPSd is unreachable or goes
    # away; 0 disables reconnecting.
    reconnect_interval: 1.0
    # GPSd's position uncertainties are divided by this to give a standard
    # deviation, then squared into the published covariance. 1.96 treats them
    # as 95% figures, as GPSd intends; use 1.0 if the receiver reports
    # standard deviations.
    uncertainty_to_sigma: 1.96
    # Publish as older releases did: fix's covariance as uncertainties in
    # meters, not variances, and extended_fix's dead-reckoned, simulated and
    # time-only fixes as STATUS_FIX. Will be removed in a future release.
    legacy_fix_semantics: false
    # Mirror of gpsd's gps_data_t on gpsd_raw, in a message named after the
    # libgps API this package was built against (GPSDRaw<MAJOR>v<MINOR>).
    # Off by default: the message is large and most users want fix/extended_fix.
    publish_gpsd_raw: false
    # Every report GPSd sends, as the raw JSON line, on gpsd_json. Carries
    # more than gpsd_raw can: libgps decodes 17 report classes and drops the
    # rest, but the JSON line reaches us regardless -- so SUBFRAME arrives
    # here even though gps_data_t::subframe can never hold it.
    publish_gpsd_json: false
